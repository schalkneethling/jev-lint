<!doctype html>
<html lang="en">
  <head><title>Mistyped inputs</title></head>
  <body>
    <form>
      <label for="email">Email address</label>
      <input id="email" name="email" type="text" />
      <label for="phone">Mobile phone</label>
      <input id="phone" name="phone" type="number" />
      <label for="zip">Postal code</label>
      <input id="zip" name="zip" type="number" />
      <label for="card">Card number</label>
      <input id="card" name="cc" type="number" />
      <label>Website <input name="site" type="text" placeholder="https://" /></label>
      <label for="pin">Choose a 4-digit PIN</label>
      <input id="pin" name="pin" type="text" />
      <label for="dob">Date of birth</label>
      <input id="dob" name="dob" type="text" />
      <input name="q" type="email" aria-label="Search products" />
      <input name="q2" type="text" aria-label="Search products" />
      <label for="departure">Departure</label>
      <input id="departure" name="departure" type="text" />
      <label for="checkin">Check-in</label>
      <input id="checkin" name="checkin" type="text" />
    </form>
  </body>
</html>
