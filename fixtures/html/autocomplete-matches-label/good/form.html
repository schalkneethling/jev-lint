<!doctype html>
<html lang="en"><head><title>Right autocomplete</title></head>
<body><form>
  <label for="a">Email address</label><input id="a" type="email" name="email" autocomplete="email" />
  <label for="b">First name</label><input id="b" name="fname" autocomplete="given-name" />
  <label for="c">Postcode</label><input id="c" name="zip" autocomplete="shipping postal-code" />
  <label for="d">Choose a password</label><input id="d" type="password" name="pw" autocomplete="new-password" />
  <label for="e">Quantity</label><input id="e" type="number" name="qty" />
  <label for="f">Coupon code</label><input id="f" name="coupon" />
  <label for="g">Message to the recipient</label><input id="g" name="gift_message" />
  <label for="h">Recipient's email address</label><input id="h" type="email" name="recipient_email" autocomplete="off" />
</form></body></html>
