<!doctype html>
<html lang="en"><head><title>Wrong descriptions</title></head>
<body><form>
  <label for="dob">Date of birth</label><input id="dob" aria-describedby="legal" />
  <label for="pw">Password</label><input id="pw" type="password" aria-describedby="phone-help" />
  <label for="email">Email address</label><input id="email" type="email" aria-describedby="promo" />
  <label for="qty">Quantity</label><input id="qty" type="number" aria-describedby="step-title" />
  <p id="legal">© 2026 Example Ltd. All rights reserved.</p>
  <p id="phone-help">Include your country code, for example +44.</p>
  <p id="promo">Summer sale: 20% off all walnut desks this week.</p>
  <h2 id="step-title">Step 3 of 4: Delivery</h2>
</form></body></html>
