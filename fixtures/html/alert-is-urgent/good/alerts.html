<!doctype html>
<html lang="en"><head><title>Urgent alerts</title></head>
<body><main>
  <div role="alert">Payment failed: your card was declined.</div>
  <div role="alert">Your session expires in 1 minute. Save your work.</div>
  <p aria-live="assertive">Connection lost. Your changes are not being saved.</p>
  <div role="alert">We could not upload the file because it is larger than 10 MB.</div>
  <div role="status">3 results found</div>
</main></body></html>
