      <h1>Understanding local() in @font-face: A Deep Dive</h1>
      <p>The local() function in a @font-face rule tells the browser to look for a font already installed on the user's device before downloading it. It sounds like a free performance win, but it has privacy and consistency trade-offs that are easy to miss.</p>
