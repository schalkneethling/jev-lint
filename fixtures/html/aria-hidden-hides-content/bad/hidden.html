<!doctype html>
<html lang="en"><head><title>Hidden content</title></head>
<body><main>
  <form><label for="card">Card number</label><input id="card" />
    <p class="error" aria-hidden="true">Your payment failed. Check your card details and try again.</p></form>
  <div class="product"><h2>Walnut desk</h2><span aria-hidden="true">Only 2 left in stock</span></div>
  <div class="field"><label for="n">Name</label><input id="n" /><span aria-hidden="true">Required field</span></div>
  <p aria-hidden="true">Orders placed after 2pm ship the next working day.</p>
  <div class="price" aria-hidden="true">£240, reduced from £320</div>
</main></body></html>
