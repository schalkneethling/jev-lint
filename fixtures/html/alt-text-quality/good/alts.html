<!doctype html>
<html lang="en">
  <head><title>Useful alt text</title></head>
  <body>
    <main>
      <img src="/img/IMG_4021.jpg" alt="A golden retriever catching a frisbee mid-air on a beach" />
      <img src="/img/logo.svg" alt="Acme Tools" />
      <img src="/img/chart.png" alt="Bar chart: revenue doubled from $2M in 2022 to $4M in 2024" />
      <img src="/img/team.jpg" alt="Five members of the support team standing in front of a whiteboard" />
      <img src="/img/divider.svg" alt="" />
      <figure>
        <img src="/img/bridge.jpg" alt="Suspension bridge with red towers, half hidden by low fog" />
        <figcaption>The Golden Gate Bridge, photographed by Lee Chen in 2019.</figcaption>
      </figure>
    </main>
  </body>
</html>
